<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Story</title>
  <style>
    :root {
      --bg: #fff5f5;
      --primary: #e63946;
      --text: #2b2d42;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #ffe3e3, var(--bg));
      color: var(--text);
      overflow-x: hidden;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .names {
      color: var(--primary);
      font-weight: 700;
    }

    .counter-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 1.5rem 2.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      margin: 1.5rem 0;
    }

    .timer {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .heart-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 50px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .heart-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(230, 57, 70, 0.3);
    }

    .floating-heart {
      position: fixed;
      bottom: -20px;
      font-size: 1.5rem;
      animation: floatUp 3.5s linear forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.8);
        opacity: 1;
      }
      100% {
        transform: translateY(-110vh) scale(1.4);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <h1><span class="names">Alex & Taylor</span></h1>
  <p>Together since October 12, 2021</p>

  <div class="counter-card">
    <div id="counter" class="timer">Calculating...</div>
  </div>

  <button class="heart-btn" onclick="spawnHeart()">Send Love ❤️</button>

  <script>
    // Set your anniversary date here (Year, Month Index 0-11, Day)
    const startDate = new Date(2021, 9, 12, 0, 0, 0);

    function updateCounter() {
      const now = new Date();
      const diff = now - startDate;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById('counter').innerText = 
        `${days} Days, ${hours}h ${minutes}m ${seconds}s`;
    }

    setInterval(updateCounter, 1000);
    updateCounter();

    function spawnHeart() {
      const heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.innerText = '❤️';
      heart.style.left = Math.random() * 90 + 5 + 'vw';
      heart.style.animationDuration = Math.random() * 1.5 + 2.5 + 's';
      document.body.appendChild(hea>rt);

      setTimeout(() => heart.remove(), 4000);
    }
  </script>
</body>
</html>
